<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Companies</title>
</head>
<body>
    <h1>Companies</h1>

    <h2>List of Companies</h2>
    <table>
        <thead>
            <tr>
                <th>Company ID</th>
                <th>Company Name</th>
                <th>Industry</th>
                <th>Website</th>
                <th>City</th>
                <th>State</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            {% for i in companies %}
                <tr>
                    <td>{{ i.company_id }}</td>
                    <td>{{ i.company_name }}</td>
                    <td>{{ i.industry }}</td>
                    <td>{{ i.website }}</td>
                    <td>{{ i.city }}</td>
                    <td>{{ i.state }}</td>
                    <td>{{ i.notes }}</td>
                </tr>
                {% endfor %}
        </tbody>
    </table>
    <br>
    <br>
    <h2>Add Company</h2>
    <form action="/companies/create" method="POST">

        <label>Company Name:</label>
        <input type="text" name="company_name" required>

        <label>Industry:</label>
        <input type="text" name="industry">

        <label>Website:</label>
        <input type="text" name="website">

        <label>City:</label>
        <input type="text" name="city">

        <label>State:</label>
        <input type="text" name="state">

        <label>Notes:</label>
        <textarea name="notes"></textarea>

        <button type="submit">Add Company</button>

    </form>
    <h2>Update Company</h2>
    <form action="/companies/update" method="POST">

        <label>Company ID:</label>
        <input type="number" name="company_id" required>

        <label>Company Name:</label>
        <input type="text" name="company_name" required>

        <label>Industry:</label>
        <input type="text" name="industry">

        <label>Website:</label>
        <input type="text" name="website">

        <label>City:</label>
        <input type="text" name="city">

        <label>State:</label>
        <input type="text" name="state">

        <label>Notes:</label>
        <textarea name="notes"></textarea>

        <button type="submit">Update</button>
    </form>

    <h2>Delete Company</h2>
    <form action="/companies/delete" method="POST">

        <label>Company ID:</label>
        <input type="number" name="company_id" required>
        <button type="submit">Delete</button>
    </form>
</body>
</html>
